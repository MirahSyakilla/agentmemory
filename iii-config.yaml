workers:
  - name: iii-http
    config:
      port: 3111
      host: 127.0.0.1
      default_timeout: 180000
      cors:
        allowed_origins: ["http://localhost:3111", "http://localhost:3113", "http://127.0.0.1:3111", "http://127.0.0.1:3113"]
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/state_store.db
  - name: iii-queue
    config:
      adapter:
        name: builtin
  - name: iii-pubsub
    config:
      adapter:
        name: local
  - name: iii-cron
    config:
      adapter:
        name: kv
  - name: iii-stream
    config:
      port: 3112
      host: 127.0.0.1
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./data/stream_store
  - name: iii-observability
    config:
      enabled: false
      service_name: agentmemory
      exporter: memory
      # The memory exporter stores spans/logs inside iii-engine. Under
      # hook-heavy daemon load this grows without bound, so collection
      # is opt-in for short debugging sessions only. If enabling this,
      # also set AGENTMEMORY_OTEL_ENABLED=true for the worker, and
      # prefer exporter: otlp for long-running installs.
      sampling_ratio: 0.0
      metrics_enabled: false
      logs_enabled: false
      logs_console_output: false
